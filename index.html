<!doctype html>
<!--
НАПРАВЛЕНИЕ: Ночной зал
THESIS: Коридор объёма — «кольца» этого приложения; ночной железный мир вместо утилитарной серой PWA. Отказ от категорийного дефолта — светлых карточек с синим акцентом.
OWN-WORLD: OLED-ночь #0A0C0E, тональные слои, волосяные линии, стекло только на шапке и таб-баре; эмбер #FF6A3D только на действии и выборе; зелень/янтарь/сталь — семантика коридора; дисплейные цифры ui-rounded 800, все цифры табличные.
STORY: открыл — увидел день, самочувствие и совет — тапнул упражнение — записал подход одной кнопкой — сегмент коридора зажёгся.
FIRST VIEWPORT: large title с датой, полоса 7 дней, карточка «как ты сегодня» с советом, ниже — «Записать» с чипами упражнений.
FORM: направление закреплено владельцем (семья Fitness+, не клон); рендиция «Ночной зал»; концепт-сид не бросался — бриф пиннед.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зал · трекер объёма</title>
<meta name="theme-color" content="#0A0C0E">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Зал">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* ---------- Ночной зал: токены ---------- */
  :root{
    --night:#0A0C0E; --surface:#16191D; --raised:#1E2328; --raised-2:#272D34;
    --line:rgba(255,255,255,.08);
    --text:#F2F4F6; --muted:#9AA4AD;
    --ember:#FF6A3D; --ember-p:#E8552B; --on-ember:#1C0E06;
    --zone:#34C77B; --over:#F5C04E; --steel:#66809A; --danger:#FF5D57;
    --glass:rgba(12,14,16,.72);
    --ease:cubic-bezier(.32,.72,0,1);
    --disp:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--night); color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(88px + env(safe-area-inset-bottom));
  }
  button,input,select,textarea{font-family:inherit}
  button{cursor:pointer;color:inherit}
  button,summary,.seg,.chips,.strip,.blocks,.cal,nav.tabs{-webkit-user-select:none;user-select:none}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  .num{font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .small{font-size:14px}
  .xs{font-size:12px;line-height:1.45}
  .lead{margin:0 2px 12px}
  :focus{outline:none}
  button:focus-visible,summary:focus-visible,select:focus-visible,
  input[type=checkbox]:focus-visible,input[type=file]:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

  /* ---------- функциональное стекло: шапка и таб-бар ---------- */
  header.app{
    position:sticky;top:0;z-index:20;
    background:var(--glass);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    backdrop-filter:blur(20px) saturate(1.4);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  header.app .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:9px;padding-bottom:9px}
  .brand{font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.15}
  .brand small{display:block;font-weight:700;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--glass);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    backdrop-filter:blur(20px) saturate(1.4);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
  nav.tabs button{flex:1;background:none;border:none;color:var(--muted);padding:9px 2px 7px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color 160ms var(--ease),opacity 160ms var(--ease)}
  nav.tabs button.on{color:var(--ember)}
  nav.tabs button:active{opacity:.55}
  nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .iconbtn{background:var(--raised);border:1px solid var(--line);color:var(--text);border-radius:13px;min-width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;transition:transform 160ms var(--ease),background-color 160ms var(--ease)}
  .iconbtn:active{transform:scale(.94);background:var(--raised-2)}
  .iconbtn.sm{min-width:36px;height:36px;border-radius:11px}
  .iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .iconbtn.sm svg{width:17px;height:17px;stroke-width:2}

  /* ---------- заголовки ---------- */
  h1.ltitle{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.02em;margin:18px 0 14px}
  h1.ltitle.cap::first-letter{text-transform:uppercase}
  h2{font-size:20px;font-weight:800;line-height:1.2;letter-spacing:-.02em;color:var(--text);margin:28px 0 10px}
  .eyebrow{display:block;font-size:13px;font-weight:600;line-height:1.3;color:var(--muted)}
  .ctitle{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}

  /* ---------- поверхности ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
  .card.tight{padding:2px 14px}
  .card.float{box-shadow:0 18px 44px rgba(0,0,0,.55)}
  .sec{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .banner{border-radius:13px;padding:12px 14px;font-size:14px;margin-bottom:10px}
  .banner.info{background:var(--raised);border:1px solid var(--line);color:var(--text)}
  .empty{color:var(--muted);font-size:14px;line-height:1.5;text-align:center;padding:22px 8px}
  .hint{margin:6px 0 0;font-size:15px;line-height:1.42}
  .rules{margin:0;padding-left:20px}
  .rules li{margin-bottom:9px;line-height:1.45}
  .rules li:last-child{margin-bottom:0}

  /* ---------- сегмент-контрол ---------- */
  .seg{display:flex;background:var(--raised);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 4px;border-radius:10px;font-size:14px;font-weight:600;transition:background-color 160ms var(--ease),color 160ms var(--ease),transform 160ms var(--ease)}
  .seg button.on{background:var(--ember);color:var(--on-ember);font-weight:700}
  .seg button:active{transform:scale(.97)}
  .seg button:not(.on):active{background:var(--raised-2)}

  /* ---------- полоса 7 дней ---------- */
  .strip{display:flex;gap:6px;margin:0 0 6px}
  .sd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .sd span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .sd i{display:block;width:100%;height:26px;border-radius:7px;border:1px solid var(--line);background:transparent}
  .sd i.on{background:var(--zone);border-color:transparent;box-shadow:0 0 14px rgba(52,199,123,.25)}
  .sd.today span{color:var(--ember)}
  .sd.today i{border-color:rgba(255,106,61,.55)}

  /* ---------- чипы ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;min-height:40px;
    background:var(--raised);border:1px solid var(--line);border-radius:999px;
    padding:10px 15px;font-size:15px;font-weight:600;color:var(--text);
    transition:transform 160ms var(--ease),background-color 160ms var(--ease);
  }
  .chip:active{transform:scale(.97);background:var(--raised-2)}
  .chip.prio{border-color:rgba(255,106,61,.45)}
  .chip.on{background:var(--ember);border-color:var(--ember);color:var(--on-ember);font-weight:700}
  .chip.on:active{background:var(--ember-p)}
  .chip.done{opacity:.55}
  .chip.ghost{border-style:dashed;color:var(--muted);font-weight:500}
  .chip.mini{min-height:34px;padding:7px 12px;font-size:13px}
  .chip .ok{color:var(--zone);font-weight:700}
  .chip.on .ok{color:var(--on-ember)}
  .chip .x{color:var(--muted);font-size:12px;font-weight:700}
  .chip.set{gap:9px}

  /* ---------- кнопки ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border-radius:13px;border:1px solid var(--line);background:var(--raised);color:var(--text);
    font-size:15px;font-weight:600;padding:13px 18px;min-height:46px;
    transition:transform 160ms var(--ease),background-color 160ms var(--ease);
  }
  .btn:active{transform:scale(.97);background:var(--raised-2)}
  .btn.primary{background:var(--ember);border-color:var(--ember);color:var(--on-ember);font-weight:800;font-size:16px}
  .btn.primary:active{background:var(--ember-p);border-color:var(--ember-p)}
  .btn.danger{background:transparent;color:var(--danger);border-color:var(--line)}
  .btn.danger:active{background:rgba(255,93,87,.12)}
  .btn.sm{padding:8px 13px;font-size:13px;min-height:34px;border-radius:11px}
  .btn.wide{width:100%}
  .linkline{font-size:14px;color:var(--muted);margin:10px 2px 0}
  .linkbtn{background:none;border:none;color:var(--ember);font-weight:700;font-size:inherit;padding:0}
  .linkbtn:active{color:var(--ember-p)}

  /* ---------- поля ---------- */
  input[type=text],input[type=number],input[type=date],select,textarea{
    background:var(--raised);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:12px;font-size:16px;width:100%;
    -webkit-appearance:none;appearance:none;
  }
  input[type=date]{min-height:46px}
  input[type=date]::-webkit-date-and-time-value{text-align:left}
  input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.5}
  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='none' stroke='%239AA4AD' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M1 1.75 6 6.5 11 1.75'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;background-size:12px 8px;padding-right:38px;
  }
  input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
  input:focus,select:focus,textarea:focus{border-color:var(--ember);box-shadow:0 0 0 3px rgba(255,106,61,.15)}
  label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
  input[type=checkbox]{
    -webkit-appearance:none;appearance:none;flex:none;margin:0;
    width:22px;height:22px;border-radius:7px;border:1px solid var(--line);background:var(--raised);position:relative;
    transition:background-color 160ms var(--ease),border-color 160ms var(--ease);
  }
  input[type=checkbox]:checked{background:var(--ember);border-color:var(--ember)}
  input[type=checkbox]:checked::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid var(--on-ember);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  input[type=file]{font-size:13px;color:var(--muted)}
  input[type=file]::-webkit-file-upload-button{
    -webkit-appearance:none;appearance:none;background:var(--raised);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:9px 13px;margin-right:10px;font-family:inherit;font-size:13px;font-weight:600;
  }
  .checkline{display:flex;gap:10px;align-items:center;font-size:14px;line-height:1.35}
  .setrow{display:grid;gap:10px;align-items:end}
  .setrow.two{grid-template-columns:1fr 1fr}
  .setrow.date{grid-template-columns:132px 1fr}

  /* ---------- коридор объёма: сигнатура ---------- */
  .grouprow{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
  .grouprow:first-child{padding-top:2px}
  .grouprow:last-child{border-bottom:0;padding-bottom:2px}
  .grouprow .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .grouprow .name{font-weight:700;font-size:17px;letter-spacing:-.01em}
  .grouprow .meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .blocks{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .blk{width:16px;height:16px;border-radius:5px;background:var(--zone);box-shadow:0 0 10px rgba(52,199,123,.25)}
  .blk.part{background:var(--steel);box-shadow:none}
  .blk.over{background:var(--over);box-shadow:0 0 10px rgba(245,192,78,.22)}
  .blk.hollow{background:transparent;box-shadow:none;border:1px solid var(--line)}
  .bar{position:relative;height:16px;border-radius:8px;background:var(--raised);border:1px solid var(--line);overflow:hidden}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--zone);border-radius:8px;box-shadow:0 0 14px rgba(52,199,123,.3)}
  .bar .fill.warn{background:var(--over);box-shadow:0 0 14px rgba(245,192,78,.26)}
  .bar .fill.part{background:var(--steel);box-shadow:none}
  .bar .tick{position:absolute;top:0;bottom:0;width:2px;border-radius:1px;background:rgba(255,255,255,.6)}
  .pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}
  .pill.under{background:var(--raised);color:var(--muted)}
  .pill.ok{background:rgba(52,199,123,.16);color:var(--zone)}
  .pill.over{background:rgba(245,192,78,.16);color:var(--over)}
  .corr .corrtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
  .corr .corrname{font-size:14px;font-weight:700}

  /* ---------- календарь ---------- */
  .calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .calhead b{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .calhead b::first-letter{text-transform:uppercase}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .wd{text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:2px 0 4px}
  .cal .day{position:relative;aspect-ratio:1;border:1px solid transparent;background:none;border-radius:11px;font-size:15px;color:var(--muted);padding:0;transition:transform 160ms var(--ease),background-color 160ms var(--ease)}
  .cal .day:active{transform:scale(.92)}
  .cal .day.tr{background:rgba(52,199,123,.15);color:var(--zone);font-weight:700}
  .cal .day.today{border-color:var(--ember);color:var(--text)}
  .cal .day.sel{background:var(--ember);border-color:var(--ember);color:var(--on-ember);font-weight:800}
  .cal .day i{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--danger)}
  .cal .day.sel i{background:var(--on-ember)}

  /* ---------- раскрывающиеся справки ---------- */
  details{border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:8px;overflow:hidden}
  details summary{padding:15px 16px;font-weight:700;font-size:16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
  details summary::-webkit-details-marker{display:none}
  details summary:active{background:rgba(255,255,255,.04)}
  details summary::after{content:"";flex:none;width:9px;height:9px;margin-right:4px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform 200ms var(--ease)}
  details[open] summary::after{transform:rotate(-135deg)}
  details .inner{padding:0 16px 14px;font-size:14px;color:var(--text)}
  details .inner ul{margin:4px 0;padding-left:20px}
  details .inner li{margin-bottom:8px;line-height:1.45}
  details .inner p{margin:10px 0 0}

  /* ---------- записи ---------- */
  .entry{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .entry:last-child{border-bottom:0}
  .entry .ex{font-weight:700;font-size:16px;letter-spacing:-.01em}
  .entry .sets{font-size:14px;color:var(--muted);margin-top:3px}
  .entry .note{font-size:13px;color:var(--muted);font-style:italic;margin-top:2px}
  .entry>button[data-del]{background:none;border:none;color:var(--muted);font-size:16px;min-width:40px;height:40px;margin:-6px -8px 0 0;border-radius:11px;transition:background-color 160ms var(--ease)}
  .entry>button[data-del]:active{background:var(--raised-2)}
  .daterow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px 2px}
  .fname{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}

  /* ---------- дисплейные цифры и графики ---------- */
  .bignum{font-family:var(--disp);font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
  .bignum .lbl{display:block;font-family:inherit;font-size:13px;font-weight:600;line-height:1.35;letter-spacing:0;color:var(--muted);margin-top:6px;font-variant-numeric:normal}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  svg.spark{display:block;width:100%;height:auto;margin-top:14px}
  svg.spark .s0{stop-color:#66809A;stop-opacity:.30}
  svg.spark .s1{stop-color:#66809A;stop-opacity:0}
  svg.spark .area{stroke:none}
  svg.spark .line{fill:none;stroke:var(--steel);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  svg.spark .dot{fill:var(--text);stroke:var(--surface);stroke-width:2}
  svg.spark text{fill:var(--muted);font-size:10px;font-weight:600;font-variant-numeric:tabular-nums;text-anchor:end}

  /* ---------- настройки ---------- */
  .overlay{position:fixed;inset:0;z-index:40;background:var(--night);overflow-y:auto;display:none}
  .overlay.open{display:block}
  .overlay .wrap{padding-bottom:calc(48px + env(safe-area-inset-bottom))}
  .ovhead{
    position:sticky;top:0;z-index:2;margin:0 -16px 4px;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:flex;justify-content:space-between;align-items:center;
    background:var(--glass);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    backdrop-filter:blur(20px) saturate(1.4);
    border-bottom:1px solid var(--line);
  }
  .ovhead b{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .tgrow{display:grid;grid-template-columns:1fr 66px 66px;gap:8px;align-items:center;padding:6px 0}
  .tgrow .n{font-size:14px;font-weight:600}
  .tgrow input{padding:10px 6px;text-align:center}
  .tgrow.head{padding:0 0 4px}
  .tgrow.head span{text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  textarea.io{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.45;min-height:140px}

  /* ---------- тост ---------- */
  #toast{
    position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));z-index:50;
    max-width:calc(100% - 40px);
    background:rgba(30,35,40,.92);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    backdrop-filter:blur(20px) saturate(1.4);
    border:1px solid var(--line);
    box-shadow:0 16px 40px rgba(0,0,0,.55);
    color:var(--text);padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;text-align:center;
    opacity:0;pointer-events:none;
    transform:translateX(-50%) translateY(10px) scale(.96);
    transition:opacity 200ms var(--ease),transform 200ms var(--ease);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

  /* ---------- авторский момент: записанный подход ---------- */
  @keyframes chippop{0%{transform:scale(.84);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes seglight{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes barlight{0%{filter:brightness(1.7)}100%{filter:brightness(1)}}
  .chip.pop{animation:chippop 220ms var(--ease)}
  .blk.pop{animation:seglight 240ms var(--ease)}
  .bar.pop .fill{animation:barlight 240ms var(--ease)}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      transition-duration:.01ms !important;
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
    }
  }
</style>
</head>
<body>

<header class="app"><div class="wrap">
  <div class="brand">Зал<small>недельный объём</small></div>
  <button class="iconbtn" id="gear" aria-label="Настройки"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M19.3 15.1a1.6 1.6 0 0 0 .32 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-.97H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.47-1.05 1.6 1.6 0 0 0-.32-1.77l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.6 1.6 0 0 0 1.77.32h.08A1.6 1.6 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.32 1.77v.08a1.6 1.6 0 0 0 1.47.97H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.47.97Z"/></svg></button>
</div></header>

<main class="wrap" id="view"></main>

<nav class="tabs"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.2 9.6v4.8M7.6 7.2v9.6M16.4 7.2v9.6M19.8 9.6v4.8M7.6 12h8.8"/></svg>Сегодня</button>
  <button data-tab="week"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.9" y="9.4" width="5.2" height="5.2" rx="1.7"/><rect x="9.4" y="9.4" width="5.2" height="5.2" rx="1.7"/><rect x="15.9" y="9.4" width="5.2" height="5.2" rx="1.7"/></svg>Неделя</button>
  <button data-tab="body"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6.4" r="2.9"/><path d="M5.4 20.2v-1.1a6.6 6.6 0 0 1 13.2 0v1.1"/></svg>Тело</button>
  <button data-tab="log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.2 6.8h15.6M4.2 12h15.6M4.2 17.2h9.6"/></svg>Журнал</button>
</div></nav>

<div class="overlay" id="settings"><div class="wrap"></div></div>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ---------- state ---------- */
const LS_KEY = "ilya-gym-v1";

const GROUPS = {
  chest:   {name:"Жим / грудь",     unit:"sets", min:8,  max:12, ord:1},
  chins:   {name:"Подтягивания",    unit:"reps", min:35, max:55, ord:2},
  forearms:{name:"Предплечья",      unit:"sets", min:10, max:16, ord:3},
  backrow: {name:"Спина (тяги)",    unit:"sets", min:6,  max:10, ord:4},
  delts:   {name:"Средняя дельта",  unit:"sets", min:6,  max:12, ord:5},
  calves:  {name:"Икры",            unit:"sets", min:6,  max:12, ord:6},
  glutes:  {name:"Ягодицы",         unit:"sets", min:0,  max:8,  ord:7},
  quads:   {name:"Ноги (жим)",      unit:"sets", min:4,  max:8,  ord:8},
  lowback: {name:"Низ спины",       unit:"sets", min:2,  max:4,  ord:9},
  abs:     {name:"Пресс",           unit:"sets", min:4,  max:8,  ord:10},
  triceps: {name:"Трицепс",         unit:"sets", min:3,  max:6,  ord:11},
};

const DEFAULT_EX = [
  {id:"bench",  name:"Жим лёжа",                     g:"chest",   reps:false, prio:1},
  {id:"chin",   name:"Подтягивания (узк. обратный)", g:"chins",   reps:true,  prio:1},
  {id:"wrist",  name:"Сгибания запястий на скамье",  g:"forearms",reps:false, prio:1},
  {id:"hammer", name:"Молотки",                      g:"forearms",reps:false, prio:0},
  {id:"lat",    name:"Широкая вертикальная тяга",    g:"backrow", reps:false, prio:0},
  {id:"kelso",  name:"Kelso shrugs",                 g:"backrow", reps:false, prio:0},
  {id:"hyper",  name:"Гиперэкстензия",               g:"lowback", reps:false, prio:0},
  {id:"delts",  name:"Махи на среднюю дельту",       g:"delts",   reps:false, prio:0},
  {id:"press1", name:"Жим-присед одноногий",         g:"quads",   reps:false, prio:0},
  {id:"ext",    name:"Разгибания",                   g:"quads",   reps:false, prio:0},
  {id:"glute",  name:"Ягодицы (упражнение уточним)", g:"glutes",  reps:false, prio:0},
  {id:"calf",   name:"Икры",                         g:"calves",  reps:false, prio:0},
  {id:"abs",    name:"Пресс",                        g:"abs",     reps:false, prio:0},
  {id:"french", name:"Французский жим с гантелями",  g:"triceps", reps:false, prio:0},
];

function freshState(){
  const tg = {};
  for(const k in GROUPS) tg[k] = {min:GROUPS[k].min, max:GROUPS[k].max};
  return {
    v:1,
    ex: JSON.parse(JSON.stringify(DEFAULT_EX)),
    tg,
    log: [
      {id:"seed1", d:"2026-08-06", ex:"bench", sets:[{w:55,r:9},{w:60,r:5},{w:60,r:5},{w:60,r:5},{w:60,r:5}], note:"стартовая запись из разговора"},
      {id:"seed2", d:"2026-08-06", ex:"chin",  sets:[{w:0,r:3},{w:0,r:3},{w:0,r:3},{w:0,r:3}], note:"подходы по памяти — поправь, если было иначе"}
    ],
    body: {}   // "YYYY-MM-DD": {w, waist, alco, ready}
  };
}

let S;
try { S = JSON.parse(localStorage.getItem(LS_KEY)) || freshState(); }
catch(e){ S = freshState(); }
if(!S.ex || !S.log) S = freshState();

/* миграция v2: пятница 07.08 из разговора, веса тела, ревизия упражнений */
if(S.v===1){
  S.v=2;
  if(S.tg.glutes) S.tg.glutes.min=0;
  const p=S.ex.find(e=>e.id==="press1"); if(p) p.name="Жим одноногий (ноги + ягодицы)";
  const g=S.ex.find(e=>e.id==="glute"); if(g) g.arch=true;
  const x=S.ex.find(e=>e.id==="ext"); if(x) x.arch=true;
  if(!S.ex.some(e=>e.id==="ohp")) S.ex.push({id:"ohp", name:"Жим гантелей вверх", g:"delts", reps:false, prio:0});
  if(!S.log.some(e=>e.id==="seed3")){
    S.log.push(
      {id:"seed3",  d:"2026-08-07", ex:"lat",    sets:[{w:36,r:20},{w:43,r:7},{w:36,r:15}]},
      {id:"seed4",  d:"2026-08-07", ex:"delts",  sets:[{w:5,r:18},{w:5,r:18},{w:5,r:18}]},
      {id:"seed5",  d:"2026-08-07", ex:"ohp",    sets:[{w:17.5,r:7},{w:15,r:8},{w:15,r:9}]},
      {id:"seed6",  d:"2026-08-07", ex:"wrist",  sets:[{w:20,r:7},{w:20,r:7},{w:20,r:7},{w:20,r:10}]},
      {id:"seed7",  d:"2026-08-07", ex:"french", sets:[{w:0,r:0},{w:0,r:0},{w:0,r:0}], note:"цифры не записаны"},
      {id:"seed8",  d:"2026-08-07", ex:"kelso",  sets:[{w:0,r:0},{w:0,r:0}], note:"цифры не записаны"},
      {id:"seed9",  d:"2026-08-07", ex:"abs",    sets:[{w:0,r:0},{w:0,r:0}]},
      {id:"seed10", d:"2026-08-07", ex:"hyper",  sets:[{w:0,r:0}], note:"с дропсетом"},
      {id:"seed11", d:"2026-08-07", ex:"press1", sets:[{w:0,r:0},{w:0,r:0},{w:0,r:0}]},
      {id:"seed12", d:"2026-08-07", ex:"calf",   sets:[{w:0,r:0},{w:0,r:0},{w:0,r:0}]}
    );
  }
  S.body["2026-08-06"]=Object.assign({}, S.body["2026-08-06"], {alco:true});
  if(S.body["2026-08-06"].w==null) S.body["2026-08-06"].w=81.55;
  S.body["2026-08-08"]=S.body["2026-08-08"]||{};
  if(S.body["2026-08-08"].w==null) S.body["2026-08-08"].w=82.6;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
}
/* миграция v3: счётчик-памп для предплечий */
if(S.v===2){
  S.v=3;
  if(!S.ex.some(e=>e.id==="fapump")) S.ex.push({id:"fapump", name:"Предплечья: памп (прочее)", g:"forearms", reps:false, quick:true, prio:0});
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
}

function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){ toast("Не удалось сохранить (память браузера)"); } }

/* ---------- date helpers ---------- */
function dstr(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0"); return y+"-"+m+"-"+dd; }
function today(){ return dstr(new Date()); }
function addDays(s,n){ const [y,m,d]=s.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dstr(dt); }
function daysBetween(a,b){ const [y1,m1,d1]=a.split("-").map(Number),[y2,m2,d2]=b.split("-").map(Number); return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/86400000); }
function fmtDay(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"short"}); }
function weekDates(){ const t=today(); const arr=[]; for(let i=6;i>=0;i--) arr.push(addDays(t,-i)); return arr; }
function shiftYM(ym,delta){ const [y,m]=ym.split("-").map(Number); const d=new Date(y,m-1+delta,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function num(v){ return parseFloat(String(v).replace(",",".").replace(/\s/g,"")); }

/* ---------- derived ---------- */
function exById(id){ return S.ex.find(e=>e.id===id); }
function groupCount(gid){
  const win = new Set(weekDates()); let n=0;
  for(const en of S.log){
    if(!win.has(en.d)) continue;
    const ex = exById(en.ex); if(!ex || ex.g!==gid) continue;
    if(GROUPS[gid].unit==="reps") n += en.sets.reduce((a,s)=>a+(+s.r||0),0);
    else n += en.sets.length;
  }
  return n;
}
function groupLastDate(gid){
  let last=null;
  for(const en of S.log){ const ex=exById(en.ex); if(ex && ex.g===gid){ if(!last||en.d>last) last=en.d; } }
  return last;
}
function lastEntry(exId){
  let best=null;
  for(const en of S.log){ if(en.ex===exId){ if(!best||en.d>best.d||(en.d===best.d&&en.id>best.id)) best=en; } }
  return best;
}
function entryFor(exId,d){ let f=null; for(const en of S.log){ if(en.ex===exId&&en.d===d) f=en; } return f; }
function est1(w,r){ return Math.round(w*(1+r/30)); }
function bestOf(exId){
  const ex=exById(exId); let b=null;
  for(const en of S.log){ if(en.ex!==exId) continue;
    for(const s of en.sets){
      if(ex.reps){ if(!b||(+s.r)>(b.r)) b={r:+s.r,w:+s.w||0,d:en.d}; }
      else { const e=est1(+s.w,+s.r); if(!b||e>b.e) b={e,w:+s.w,r:+s.r,d:en.d}; }
    }
  }
  return b;
}
function plural(n,f){ const a=Math.abs(n)%100, b=a%10; return n+" "+(a>10&&a<20?f[2]:b>1&&b<5?f[1]:b===1?f[0]:f[2]); }
function fmtSets(en){
  const ex=exById(en.ex);
  if(ex && ex.reps){
    const tot=en.sets.reduce((a,s)=>a+(+s.r||0),0);
    const parts=en.sets.map(s=> (+s.w>0? "+"+s.w+"кг×":"")+s.r );
    return parts.join("·")+" (всего "+tot+" повт)";
  }
  if(en.sets.every(s=>!(+s.w)&&!(+s.r))) return plural(en.sets.length,["подход","подхода","подходов"])+" без цифр";
  const out=[]; let i=0;
  while(i<en.sets.length){
    let j=i; while(j+1<en.sets.length && en.sets[j+1].w===en.sets[i].w && en.sets[j+1].r===en.sets[i].r) j++;
    const cnt=j-i+1; const s=en.sets[i];
    const lbl=(+s.w||+s.r)? s.w+"×"+s.r : "—";
    out.push(lbl+(cnt>1?" ×"+cnt:"")); i=j+1;
  }
  return out.join(" · ");
}
function statusOf(gid){
  const c=groupCount(gid), t=S.tg[gid]||GROUPS[gid];
  if(c<t.min) return {s:"under", c, t};
  if(c>t.max) return {s:"over", c, t};
  return {s:"ok", c, t};
}

/* ---------- UI plumbing ---------- */
const view=document.getElementById("view");
let TAB="today";
let openEx=null;          // exercise id whose log form is open
let curW="", curR="";     // поля текущего подхода
let formDate=null;        // дата, за которую идёт запись
let formNote="";          // заметка активной записи
let logFilter="all";
let logDate=null;         // calendar day filter in journal
let calYM=null;           // displayed calendar month
let toastTimer=null;
let pulseSet=false;       // косметика: подсветить только что записанный подход
let sparkN=0;             // косметика: уникальные id градиентов графиков

/* коридор объёма — сигнатурный компонент, только разметка */
function corridorHTML(gid, st, popIdx){
  const t=st.t;
  if(GROUPS[gid].unit==="sets"){
    let h='<div class="blocks">';
    const show=Math.max(st.c,t.min);
    for(let i=0;i<show;i++){
      if(i<st.c){
        let bc="blk"; if(st.s==="under") bc+=" part"; else if(i>=t.max) bc+=" over";
        if(i===popIdx) bc+=" pop";
        h+='<div class="'+bc+'"></div>';
      }
      else h+='<div class="blk hollow"></div>';
    }
    return h+"</div>";
  }
  const pct=Math.min(100, st.c/t.max*100);
  const minPct=t.min/t.max*100;
  return '<div class="bar'+(popIdx>=0?" pop":"")+'"><div class="fill'+(st.s==="over"?" warn":st.s==="under"?" part":"")+'" style="width:'+pct+'%"></div>'+
         '<div class="tick" style="left:'+minPct+'%"></div></div>';
}
function unitWord(gid){ return GROUPS[gid].unit==="reps"?"повторений":"подходов"; }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1900); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
/* системные confirm/alert могут быть недоступны — подтверждение двойным тапом */
function wireEntryDeletes(){
  document.querySelectorAll("[data-del]").forEach(bt=>{
    bt.addEventListener("click",()=>{
      if(bt.dataset.armed){ S.log=S.log.filter(e=>e.id!==bt.dataset.del); save(); render(); toast("Удалено"); return; }
      bt.dataset.armed="1"; bt.textContent="Удалить?";
      bt.style.color="var(--danger)"; bt.style.fontWeight="700"; bt.style.fontSize="13px";
      setTimeout(()=>{ if(document.body.contains(bt)){ delete bt.dataset.armed; bt.textContent="✕"; bt.style.color=""; bt.style.fontWeight=""; bt.style.fontSize=""; } },3500);
    });
  });
}

document.querySelectorAll("nav.tabs button").forEach(b=>{
  b.addEventListener("click",()=>{ TAB=b.dataset.tab; render(); window.scrollTo(0,0); });
});

/* ---------- TODAY ---------- */
function renderToday(){
  const t=today();
  const b=S.body[t]||{};
  const yest=S.body[addDays(t,-1)]||{};
  const ready=b.ready||null;

  let h="";
  const dateTitle=new Date().toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
  h+='<h1 class="ltitle cap">'+esc(dateTitle)+"</h1>";

  // last 7 days strip
  const DOW=["вс","пн","вт","ср","чт","пт","сб"];
  h+='<div class="strip">';
  weekDates().forEach(d=>{
    const [y,m,dd]=d.split("-").map(Number);
    const dow=DOW[new Date(y,m-1,dd).getDay()];
    const trained=S.log.some(e=>e.d===d);
    h+='<div class="sd'+(d===t?" today":"")+'"><span>'+dow+"</span><i"+(trained?' class="on"':"")+"></i></div>";
  });
  h+="</div>";

  // one card: state -> hint -> deficits
  const under=Object.keys(GROUPS).map(g=>({g,...statusOf(g)})).filter(x=>x.s==="under")
    .sort((a,b)=>GROUPS[a.g].ord-GROUPS[b.g].ord);
  const chest=statusOf("chest");
  const chestLast=groupLastDate("chest");
  const chestAgo=chestLast?daysBetween(chestLast,t):99;
  let hint="";
  if(yest.alco) hint="<b>Лёгкий день.</b> Вчера был алкоголь — белок сегодня обязателен, голодовка и рекорды запрещены.";
  else if(ready==="low") hint="<b>Лёгкий день:</b> икры, пресс, предплечья, дельта, гиперэкстензия. Тяжёлое не трогаем.";
  else if(chest.s==="under" && chestAgo>=2) hint=(ready==="fresh"
    ? "<b>Жим-день, тяжёлый.</b> Отказ — только в последнем подходе."
    : "<b>Жим-день, средний.</b> 55 кг × 8–10, запас 2–3.");
  else if(statusOf("chins").s==="under"||statusOf("backrow").s==="under") hint="<b>Спина-день.</b> Подтягивания двойками-тройками свежими, широкая тяга, Kelso.";
  else if(statusOf("quads").s==="under"||statusOf("glutes").s==="under"||statusOf("calves").s==="under") hint="<b>Ноги-день.</b> Одноногий жим, разгибания, ягодицы, икры.";
  else if(under.length) hint="<b>Мелочь дня:</b> "+under.slice(0,3).map(x=>GROUPS[x.g].name.toLowerCase()).join(", ")+".";
  else hint="<b>Все группы в зоне.</b> Держи уровень, рекорды не обязательны.";

  h+='<div class="card">';
  h+='<span class="ctitle">Как ты сегодня?</span>';
  h+='<div class="seg" id="ready">';
  [["fresh","Свежий"],["ok","Норм"],["low","Подбитый"]].forEach(([k,l])=>{
    h+='<button data-r="'+k+'" aria-pressed="'+(ready===k)+'" class="'+(ready===k?"on":"")+'">'+l+"</button>";
  });
  h+="</div>";
  h+='<div class="sec"><span class="eyebrow">Совет на сегодня</span><p class="hint">'+hint+"</p></div>";
  if(under.length){
    h+='<div class="sec"><span class="eyebrow">Недобор объёма за 7 дней</span><div class="chips" style="margin-top:10px">';
    under.slice(0,3).forEach(x=>{
      h+='<button class="chip mini" data-goweek="1">'+esc(GROUPS[x.g].name)+' <span class="num muted">'+x.c+" из "+x.t.min+"–"+x.t.max+"</span></button>";
    });
    h+='</div><div class="xs muted" style="margin-top:10px">Это сумма твоих записей за неделю, не сегодняшний план. Тап — детали в «Неделе».</div></div>';
  }
  h+="</div>";

  if(b.w==null) h+='<div class="linkline">Утренний вес не записан — <button class="linkbtn" id="gobody">внести</button></div>';

  // quick log — the main action
  h+="<h2>Записать</h2>";
  const doneToday=new Set(S.log.filter(e=>e.d===t).map(e=>e.ex));
  const sorted=[...S.ex].filter(e=>!e.arch).sort((a,b)=> (b.prio-a.prio) || (GROUPS[a.g].ord-GROUPS[b.g].ord));
  h+='<div class="chips" id="exchips">';
  sorted.forEach(e=>{ h+='<button class="chip '+(e.prio?"prio ":"")+(doneToday.has(e.id)?"done ":"")+(openEx===e.id?"on":"")+'" data-ex="'+e.id+'">'+(doneToday.has(e.id)?'<span class="ok">✓</span>':"")+esc(e.name)+"</button>"; });
  h+='<button class="chip ghost" id="addex">+ своё</button></div>';

  if(openEx){
    const ex=exById(openEx);
    const le=lastEntry(openEx), be=bestOf(openEx);
    const tE=entryFor(openEx,formDate);
    h+='<div class="card float" style="margin-top:10px" id="logform">';
    h+='<div class="fname">'+esc(ex.name)+"</div>";
    if(le && le.d!==formDate) h+='<div class="small muted">Прошлый раз ('+fmtDay(le.d)+'): <span class="num">'+fmtSets(le)+"</span></div>";
    if(be && !ex.quick){
      if(ex.reps) h+='<div class="small muted">Рекорд подхода: <span class="num">'+be.r+(be.w?" с +"+be.w+" кг":"")+"</span></div>";
      else if(be.e) h+='<div class="small muted">Лучшее: <span class="num">'+be.w+"×"+be.r+" (≈"+be.e+" на раз)</span></div>";
    }
    // коридор группы — сюда попадает записанный подход

    "<li><b>Жим-день (тяжёлый):</b> жим 4–5×5 (отказ только в последнем) · подтяг 4×2–3 свежими · запястья 4 · молотки 1 · дельта 2–3 · пресс 2</li>"+
    "<li><b>Жим-день (средний):</b> жим 3×8–10 с запасом 2–3 · подтяг 4×3 · французский 2–3 · запястья 3–4 · дельта 3</li>"+

  if(gobody) gobody.addEventListener("click",()=>{ TAB="body"; render(); window.scrollTo(0,0); });
  document.querySelectorAll("#exchips .chip[data-ex]").forEach(c=>{
    c.addEventListener("click",()=>{
      const id=c.dataset.ex;

      openEx=id; formDate=today();
      const te0=entryFor(id,formDate);
      formNote=(te0&&te0.note)||"";
      const lp=lastEntry(id);
      const src=(te0&&te0.sets.length)? te0.sets[te0.sets.length-1] : (lp&&lp.sets.length? lp.sets[lp.sets.length-1] : null);
      curW=(src&&+src.w)? String(src.w):""; curR=(src&&+src.r)? String(src.r):"";

    if(cr) cr.addEventListener("input",()=>{ curR=cr.value; });
    const ed=document.getElementById("entrydate");
    ed.addEventListener("change",()=>{
      formDate=(/^\d{4}-\d{2}-\d{2}$/.test(ed.value)&&ed.value<=today())? ed.value : today();
      const te2=entryFor(openEx,formDate); formNote=(te2&&te2.note)||"";
      render();
    });
    const en=document.getElementById("entrynote");
    en.addEventListener("input",()=>{
      formNote=en.value;
      const e2=entryFor(openEx,formDate);
      if(e2){ e2.note=formNote.trim()||undefined; save(); }
    });
    document.querySelectorAll("[data-rmset]").forEach(bt=>{
      bt.addEventListener("click",()=>{
        const e2=entryFor(openEx,formDate); if(!e2) return;
        e2.sets.splice(+bt.dataset.rmset,1);
        if(!e2.sets.length) S.log=S.log.filter(x=>x.id!==e2.id);
        save(); render(); toast("Подход убран");
      });
    });
    document.getElementById("addsetbtn").addEventListener("click",()=>{
      const ab=document.getElementById("addsetbtn");
      let w=num(curW)||0, r=parseInt(String(curR).trim(),10)||0;
      if(ex.quick){ w=0; r=0; }
      else if(ex.reps && !(r>0)){ toast("Введи повторения"); return; }
      else if(!(w>0)&&!(r>0)){
        if(!ab.dataset.armed){
          ab.dataset.armed="1"; ab.textContent="Записать подход без цифр?";
          setTimeout(()=>{ if(document.body.contains(ab)){ delete ab.dataset.armed; ab.textContent="Записать подход"; } },4000);
          return;
        }
      }
      let e2=entryFor(openEx,formDate);
      if(!e2){ e2={id:uid(), d:formDate, ex:openEx, sets:[], note:formNote.trim()||undefined}; S.log.push(e2); }
      e2.sets.push({w,r});
      pulseSet=true;
      save(); render();
      toast("Подход "+e2.sets.length+" записан"+(formDate===today()?"":" за "+fmtDay(formDate)));
    });
    document.getElementById("donebtn").addEventListener("click",()=>{ openEx=null; render(); });
  }
  wireEntryDeletes();
}

/* ---------- BODY ---------- */
function spark(series){
  if(series.length<2) return '<div class="empty">Мало данных — нужно хотя бы две записи</div>';
  const w=300,hh=78,p=13,gut=36;
  const vs=series.map(s=>s.v);
  let mn=Math.min(...vs), mx=Math.max(...vs);
  if(mx-mn<0.5){ mx+=0.5; mn-=0.5; }
  const x=i=> gut + i*(w-gut-p)/(series.length-1);
  const y=v=> hh-p - (v-mn)*(hh-2*p)/(mx-mn);
  let d="M"+x(0)+" "+y(series[0].v);
  series.forEach((s,i)=>{ if(i) d+=" L"+x(i)+" "+y(s.v); });
  const last=series[series.length-1], gid="sparkfill"+(++sparkN);
  return '<svg class="spark" viewBox="0 0 '+w+" "+hh+'" role="img" aria-label="график">'+
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop class="s0" offset="0"/><stop class="s1" offset="1"/></linearGradient></defs>'+
    '<path class="area" fill="url(#'+gid+')" d="'+d+" L"+x(series.length-1)+" "+hh+" L"+x(0)+" "+hh+' Z"/>'+
    '<path class="line" d="'+d+'"/>'+
    '<circle class="dot" cx="'+x(series.length-1)+'" cy="'+y(last.v)+'" r="3.4"/>'+
    '<text x="'+(gut-8)+'" y="'+(y(mx)+3.5)+'">'+mx.toFixed(1)+'</text>'+
    '<text x="'+(gut-8)+'" y="'+(y(mn)+3.5)+'">'+mn.toFixed(1)+"</text></svg>";
}
function weightTrend(){
  // линейная регрессия по взвешиваниям за последние 28 дней → кг/нед
  const pts=Object.entries(S.body).filter(([,v])=>v.w!=null)
    .map(([d,v])=>({x:daysBetween("2026-01-01",d), y:+v.w}))
    .sort((a,b)=>a.x-b.x);
  if(pts.length<4) return null;
  const lastX=pts[pts.length-1].x;
  const win=pts.filter(p=>p.x>=lastX-27);
  const span=win.length? win[win.length-1].x-win[0].x : 0;
  if(win.length<4||span<7) return null;
  const n=win.length;
  let sx=0,sy=0,sxx=0,sxy=0;
  win.forEach(p=>{ sx+=p.x; sy+=p.y; sxx+=p.x*p.x; sxy+=p.x*p.y; });
  const den=n*sxx-sx*sx; if(!den) return null;
  return {wk:(n*sxy-sx*sy)/den*7, n, days:span};
}

    h+=spark(wents.map(([d,v])=>({d,v:+v.waist})));
  } else h+='<div class="empty">Раз в неделю, утром, в тех же условиях. Не втягивать.</div>';
  h+="</div>";

    "<li>Каждый приём — с белком. Овсянка без творога или яиц — не белок.</li>"+

  view.innerHTML=h;

  document.getElementById("savebody").addEventListener("click",()=>{

function renderCalendar(){
  const now=today();
  const ym = calYM || now.slice(0,7);
  const [y,m]=ym.split("-").map(Number);
  const first=new Date(y,m-1,1);
  const startDow=(first.getDay()+6)%7; // понедельник = 0
  const dim=new Date(y,m,0).getDate();
  const trained=new Set(S.log.map(e=>e.d));
  const alco=new Set(Object.entries(S.body).filter(([,v])=>v.alco).map(([d])=>d));
  let h='<div class="card">';
  h+='<div class="calhead"><button class="iconbtn sm" data-cal="-1" aria-label="Прошлый месяц"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button><b>'+first.toLocaleDateString("ru-RU",{month:"long",year:"numeric"})+'</b><button class="iconbtn sm" data-cal="1" aria-label="Следующий месяц"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg></button></div>';
  h+='<div class="cal">';
  ["пн","вт","ср","чт","пт","сб","вс"].forEach(w=>h+='<div class="wd">'+w+"</div>");
  for(let i=0;i<startDow;i++) h+="<div></div>";
  for(let d=1;d<=dim;d++){
    const ds=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const cls=["day"]; if(trained.has(ds))cls.push("tr"); if(ds===now)cls.push("today"); if(logDate===ds)cls.push("sel");
    h+='<button class="'+cls.join(" ")+'" data-day="'+ds+'">'+d+(alco.has(ds)?"<i></i>":"")+"</button>";
  }
  h+="</div>";
  h+='<div class="xs muted" style="margin-top:12px">Зелёное — был в зале, точка — алкоголь. Тапни день, чтобы увидеть записи.</div>';
  h+="</div>";
  return h;
}

  h+="</select>";

  if(logDate) h+='<div class="linkline" style="margin:0 2px 10px">Записи за '+fmtDay(logDate)+' — <button class="linkbtn" id="cleardate">показать все</button></div>';

  const list=S.log
    .filter(e=>logFilter==="all"||e.ex===logFilter)
    .filter(e=>!logDate||e.d===logDate)
    .sort((a,b)=> a.d<b.d?1:a.d>b.d?-1:0);
  if(logFilter!=="all"){
    const be=bestOf(logFilter); const ex=exById(logFilter);
    if(be) h+='<div class="banner info">Лучшее: <span class="num">'+(ex.reps? be.r+" повт"+(be.w?" (+"+be.w+" кг)":"") : be.w+"×"+be.r+" ≈ "+be.e+" на раз")+"</span> · "+fmtDay(be.d)+"</div>";
  }
  if(!list.length) h+='<div class="empty">'+(logDate?"В этот день записей нет":"Пока пусто")+"</div>";
  let curD=null;
  list.forEach(en=>{
    if(en.d!==curD){ if(curD!==null) h+="</div>"; curD=en.d; h+='<div class="daterow">'+fmtDay(en.d)+'</div><div class="card tight">'; }
    const ex=exById(en.ex);
    h+='<div class="entry"><div><div class="ex">'+esc(ex?ex.name:"?")+'</div><div class="sets num">'+fmtSets(en)+"</div>"+(en.note?'<div class="note">'+esc(en.note)+"</div>":"")+"</div>"+
       '<button data-del="'+en.id+'" aria-label="Удалить">✕</button></div>';
  });
  if(curD!==null) h+="</div>";
  view.innerHTML=h;

  document.querySelectorAll("[data-cal]").forEach(bt=>{
    bt.addEventListener("click",()=>{ calYM=shiftYM(calYM||today().slice(0,7), +bt.dataset.cal); render(); });
  });
  document.querySelectorAll("[data-day]").forEach(bt=>{
    bt.addEventListener("click",()=>{ logDate=(logDate===bt.dataset.day?null:bt.dataset.day); render(); });
  });
  const cd=document.getElementById("cleardate");
  if(cd) cd.addEventListener("click",()=>{ logDate=null; render(); });
  document.getElementById("logfilter").addEventListener("change",e=>{ logFilter=e.target.value; render(); });
  wireEntryDeletes();
}

/* ---------- SETTINGS ---------- */
const settingsEl=document.getElementById("settings");
function openSettings(focus){
  const w=settingsEl.querySelector(".wrap");
  let h='<div class="ovhead"><b>Настройки</b><button class="iconbtn" id="closeset" aria-label="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 6.6l10.8 10.8M17.4 6.6L6.6 17.4"/></svg></button></div>';

  h+="<h2>Недельные диапазоны</h2><div class='card'>";
  h+='<div class="xs muted" style="margin-bottom:12px">Коридор объёма на 7 дней: мин — ниже роста не жди, макс — потолок восстановления.</div>';
  h+='<div class="tgrow head"><span></span><span class="xs muted">мин</span><span class="xs muted">макс</span></div>';
  Object.keys(GROUPS).sort((a,b)=>GROUPS[a].ord-GROUPS[b].ord).forEach(g=>{
    const t=S.tg[g];
    h+='<div class="tgrow"><span class="n">'+esc(GROUPS[g].name)+' <span class="xs muted">('+(GROUPS[g].unit==="reps"?"повт":"подх")+')</span></span>'+
       '<input type="number" inputmode="numeric" aria-label="минимум" data-g="'+g+'" data-k="min" value="'+t.min+'">'+
       '<input type="number" inputmode="numeric" aria-label="максимум" data-g="'+g+'" data-k="max" value="'+t.max+'"></div>';
  });
  h+='<button class="btn wide" id="savetg" style="margin-top:14px">Сохранить</button></div>';

  h+="<h2 id='addexh'>Добавить упражнение</h2><div class='card'>";
  h+='<label class="f">Название</label><input type="text" id="newname" placeholder="Например: Ягодичный мост">';
  h+='<label class="f" style="margin-top:14px">Группа</label><select id="newgroup">';
  Object.keys(GROUPS).sort((a,b)=>GROUPS[a].ord-GROUPS[b].ord).forEach(g=>{ h+='<option value="'+g+'">'+esc(GROUPS[g].name)+"</option>"; });
  h+="</select>";
  h+='<label class="checkline" style="margin-top:14px"><input type="checkbox" id="newreps"> Считать повторения, а не подходы (как подтягивания)</label>';
  h+='<label class="checkline" style="margin-top:12px"><input type="checkbox" id="newquick"> Счётчик: только подходы, без веса и повторений (памп)</label>';
  h+='<button class="btn primary wide" id="addexbtn" style="margin-top:14px">Добавить</button></div>';

  h+="<h2>Упражнения</h2><div class='card tight'>";
  S.ex.forEach(e=>{
    h+='<div class="entry"><div><span class="ex">'+esc(e.name)+'</span> <span class="xs muted">'+esc(GROUPS[e.g].name)+"</span></div>"+
       '<button class="btn sm" data-arch="'+e.id+'">'+(e.arch?"вернуть":"скрыть")+"</button></div>";
  });
  h+="</div>";

  h+="<h2>Данные</h2><div class='card'>";
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="exportbtn">Экспорт в файл</button><button class="btn" id="importbtn">Импорт</button><button class="btn danger" id="wipebtn">Стереть всё</button></div>';
  h+='<div id="iozone" style="margin-top:12px"></div>';
  h+='<p class="xs muted" style="margin:14px 0 0">Данные живут в браузере этого устройства. Раз в неделю делай экспорт — страховка.</p></div>';

  w.innerHTML=h;
  settingsEl.classList.add("open");
  document.getElementById("closeset").addEventListener("click",()=>settingsEl.classList.remove("open"));

  document.getElementById("savetg").addEventListener("click",()=>{
    w.querySelectorAll(".tgrow input").forEach(inp=>{
      const v=parseInt(inp.value,10); if(!isNaN(v)&&v>=0) S.tg[inp.dataset.g][inp.dataset.k]=v;
    });
    for(const g in S.tg){ if(S.tg[g].max<S.tg[g].min) S.tg[g].max=S.tg[g].min; }
    save(); toast("Диапазоны сохранены"); render();
  });
  document.getElementById("addexbtn").addEventListener("click",()=>{
    const name=document.getElementById("newname").value.trim();
    if(!name){ toast("Введи название"); return; }
    const quick=document.getElementById("newquick").checked;
    S.ex.push({id:uid(), name, g:document.getElementById("newgroup").value, reps:!quick&&document.getElementById("newreps").checked, quick, prio:0});
    save(); toast("Добавлено: "+name); settingsEl.classList.remove("open"); render();
  });
  w.querySelectorAll("[data-arch]").forEach(bt=>{
    bt.addEventListener("click",()=>{ const e=exById(bt.dataset.arch); e.arch=!e.arch; save(); openSettings(); });
  });
  document.getElementById("exportbtn").addEventListener("click",doExport);
  document.getElementById("importbtn").addEventListener("click",()=>{
    document.getElementById("iozone").innerHTML=
      '<label class="f">Вставь JSON экспорта</label><textarea class="io" id="importtext"></textarea>'+
      '<input type="file" id="importfile" accept=".json" style="margin-top:8px">'+
      '<button class="btn primary wide" id="doimport" style="margin-top:8px">Импортировать (заменит текущее)</button>';
    document.getElementById("importfile").addEventListener("change",ev=>{
      const f=ev.target.files[0]; if(!f) return;
      const r=new FileReader(); r.onload=()=>{ document.getElementById("importtext").value=r.result; }; r.readAsText(f);
    });
    document.getElementById("doimport").addEventListener("click",()=>{
      const bt=document.getElementById("doimport");
      try{
        const data=JSON.parse(document.getElementById("importtext").value);
        const st=data.state||data;
        if(!st.log||!st.ex) throw new Error("bad");
        if(!bt.dataset.armed){
          bt.dataset.armed="1"; bt.textContent="Заменит все данные — точно?";
          setTimeout(()=>{ if(document.body.contains(bt)){ delete bt.dataset.armed; bt.textContent="Импортировать (заменит текущее)"; } },4000);
          return;
        }
        S=st; save(); settingsEl.classList.remove("open"); render(); toast("Импортировано");
      }catch(e){ toast("Не похоже на файл экспорта"); }
    });
  });
  document.getElementById("wipebtn").addEventListener("click",()=>{
    const bt=document.getElementById("wipebtn");
    if(bt.dataset.armed){ S=freshState(); save(); settingsEl.classList.remove("open"); render(); toast("Чистый лист"); return; }
    bt.dataset.armed="1"; bt.textContent="Точно стереть? Навсегда";
    setTimeout(()=>{ if(document.body.contains(bt)){ delete bt.dataset.armed; bt.textContent="Стереть всё"; } },4000);
  });
  if(focus==="addex"){ const el=document.getElementById("addexh"); if(el) el.scrollIntoView(); }
}
async function doExport(){
  const payload=JSON.stringify({app:"ilya-gym", version:1, exportedAt:new Date().toISOString(), state:S}, null, 1);
  const fname="gym-log-"+today()+".json";
  if(window.claude && window.claude.downloads && window.claude.downloads.save){
    try{ await window.claude.downloads.save({filename:fname, data:payload}); toast("Файл сохранён"); return; }
    catch(e){ /* пользователь мог отменить — падаем в запасной вариант */ }
  }
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([payload],{type:"application/json"}));
    a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    toast("Файл скачан");
  }catch(e){
    document.getElementById("iozone").innerHTML='<label class="f">Скопируй и сохрани куда-нибудь</label><textarea class="io">'+esc(payload)+"</textarea>";
  }
}
document.getElementById("gear").addEventListener("click",()=>openSettings());

/* ---------- render root ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===TAB));
  if(TAB==="today") renderToday();
  else if(TAB==="week") renderWeek();
  else if(TAB==="body") renderBody();
  else renderLog();
}
render();

/* ---------- offline ---------- */
if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>

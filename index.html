<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зал · трекер объёма</title>
<meta name="theme-color" content="#0F1317">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Зал">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#F2F3F2; --surface:#FFFFFF; --surface2:#E9EDEF; --line:#D6DBDF; --line2:#C4CBD1;
    --text:#171B1F; --muted:#5C666E; --accent:#2F6395; --accent-c:#FFFFFF; --accent-soft:#2F639518;
    --ok:#24784C; --ok-soft:#24784C1A; --warn:#A87716; --warn-soft:#A8771620; --danger:#B04A3C;
    --chip:#EDF0F2; --part:#A6BACB;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0F1317; --surface:#171C21; --surface2:#1F262C; --line:#2A333B; --line2:#38434D;
      --text:#E8EAEC; --muted:#97A1A9; --accent:#7FB0DC; --accent-c:#0E1418; --accent-soft:#7FB0DC22;
      --ok:#5CBE8A; --ok-soft:#5CBE8A22; --warn:#D9A441; --warn-soft:#D9A44126; --danger:#D07A6B;
      --chip:#212930; --part:#4E6A85;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  .num{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

  header.app{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  header.app .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:10px}
  .brand{font-weight:800;font-size:17px;letter-spacing:-.01em}
  .brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .iconbtn{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
  .iconbtn:active{transform:scale(.97)}
  .iconbtn.sm{min-width:34px;height:34px;font-size:16px}

  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:22px 0 8px}
  .eyebrow{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .card.tight{padding:10px 12px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .xs{font-size:12px}

  .banner{border-radius:12px;padding:11px 13px;font-size:14px;margin-bottom:10px;border:1px solid}
  .banner.info{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}

  .seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}

  .strip{display:flex;gap:6px;margin:0 0 4px}
  .sd{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
  .sd.today span{color:var(--text);font-weight:700}
  .sd i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line2)}
  .sd i.on{background:var(--ok);border-color:var(--ok)}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text)}
  .chip.prio{border-color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-c)}
  .chip.done{opacity:.5}
  .chip.ghost{border-style:dashed;color:var(--muted);font-weight:500}
  .chip.mini{padding:6px 10px;font-size:13px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15px;font-weight:600;padding:11px 16px;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-c)}
  .btn.danger{color:var(--danger);border-color:var(--danger)}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
  .btn:active{transform:scale(.98)}
  .btn.wide{width:100%}
  .linkline{font-size:13px;color:var(--muted);margin:10px 2px 0}
  .linkbtn{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;font-size:inherit;padding:0}

  input[type=text],input[type=number],input[type=date],select,textarea{
    background:var(--surface);border:1px solid var(--line2);color:var(--text);
    border-radius:10px;padding:10px 10px;font-size:16px;width:100%;font-family:inherit
  }
  input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}

  .setrow{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;margin-bottom:8px;align-items:center}
  .setrow .del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;height:40px}

  .grouprow{display:flex;flex-direction:column;gap:6px;padding:11px 0;border-bottom:1px solid var(--line)}
  .grouprow:last-child{border-bottom:0}
  .grouprow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .grouprow .name{font-weight:700;font-size:15px}
  .blocks{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .blk{width:16px;height:16px;border-radius:4px;background:var(--ok)}
  .blk.hollow{background:transparent;border:1.5px dashed var(--line2)}
  .blk.over{background:var(--warn)}
  .blk.part{background:var(--part)}
  .bar{position:relative;height:14px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:7px}
  .bar .fill.warn{background:var(--warn)}
  .bar .fill.part{background:var(--part)}
  .bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--line2)}
  .pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
  .pill.under{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.over{background:var(--warn-soft);color:var(--warn)}

  .calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .calhead b{font-size:14px;text-transform:capitalize}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .wd{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:2px 0}
  .cal .day{position:relative;aspect-ratio:1;border:1px solid transparent;background:none;border-radius:9px;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit;padding:0}
  .cal .day.tr{background:var(--ok-soft);color:var(--ok);font-weight:700}
  .cal .day.today{border-color:var(--accent);color:var(--text)}
  .cal .day.sel{background:var(--accent);color:var(--accent-c);font-weight:700}
  .cal .day i{position:absolute;left:50%;transform:translateX(-50%);bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--warn)}

  details{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px}
  details summary{padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
  details summary::after{content:"+";color:var(--muted);font-size:17px}
  details[open] summary::after{content:"–"}
  details .inner{padding:0 14px 12px;font-size:14px}
  details .inner ul{margin:6px 0;padding-left:18px}
  details .inner li{margin-bottom:6px}
  details .inner p{margin:8px 0}

  .entry{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
  .entry:last-child{border-bottom:0}
  .entry .ex{font-weight:700;font-size:14px}
  .entry .sets{font-size:14px;color:var(--muted)}
  .entry .note{font-size:12px;color:var(--muted);font-style:italic}
  .entry button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}

  .daterow{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:16px 0 4px}

  .bignum{font-size:34px;font-weight:800;letter-spacing:-.02em}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  svg.spark{display:block;width:100%;height:60px}
  svg.spark path{fill:none;stroke:var(--accent);stroke-width:2}
  svg.spark circle{fill:var(--accent)}
  svg.spark text{fill:var(--muted);font-size:10px;font-family:ui-monospace,Menlo,monospace}

  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
  nav.tabs button{flex:1;background:none;border:none;color:var(--muted);padding:9px 2px 8px;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav.tabs button.on{color:var(--accent)}
  nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .overlay{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;display:none}
  .overlay.open{display:block}
  .overlay .wrap{padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:40px}
  .ovhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .ovhead b{font-size:18px}

  .tgrow{display:grid;grid-template-columns:1fr 64px 64px;gap:8px;align-items:center;padding:6px 0}
  .tgrow .n{font-size:14px;font-weight:600}
  .tgrow input{padding:8px 6px;text-align:center}
  .tgrow.head{padding:0 0 2px}
  .tgrow.head span{text-align:center}

  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));z-index:50;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:1}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:18px 8px}
  textarea.io{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:120px}
</style>
</head>
<body>

<header class="app"><div class="wrap">
  <div class="brand">Зал<small>недельный объём</small></div>
  <button class="iconbtn" id="gear" aria-label="Настройки">⚙</button>
</div></header>

<main class="wrap" id="view"></main>

<nav class="tabs"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Сегодня</button>
  <button data-tab="week"><svg viewBox="0 0 24 24"><path d="M4 19V11M10 19V5M16 19v-8M22 19H2"/></svg>Неделя</button>
  <button data-tab="body"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>Тело</button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Журнал</button>
</div></nav>

<div class="overlay" id="settings"><div class="wrap"></div></div>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ---------- state ---------- */
const LS_KEY = "ilya-gym-v1";

const GROUPS = {
  chest:   {name:"Жим / грудь",     unit:"sets", min:8,  max:12, ord:1},
  chins:   {name:"Подтягивания",    unit:"reps", min:35, max:55, ord:2},
  forearms:{name:"Предплечья",      unit:"sets", min:10, max:16, ord:3},
  backrow: {name:"Спина (тяги)",    unit:"sets", min:6,  max:10, ord:4},
  delts:   {name:"Средняя дельта",  unit:"sets", min:6,  max:12, ord:5},
  calves:  {name:"Икры",            unit:"sets", min:6,  max:12, ord:6},
  glutes:  {name:"Ягодицы",         unit:"sets", min:0,  max:8,  ord:7},
  quads:   {name:"Ноги (жим)",      unit:"sets", min:4,  max:8,  ord:8},
  lowback: {name:"Низ спины",       unit:"sets", min:2,  max:4,  ord:9},
  abs:     {name:"Пресс",           unit:"sets", min:4,  max:8,  ord:10},
  triceps: {name:"Трицепс",         unit:"sets", min:3,  max:6,  ord:11},
};

const DEFAULT_EX = [
  {id:"bench",  name:"Жим лёжа",                     g:"chest",   reps:false, prio:1},
  {id:"chin",   name:"Подтягивания (узк. обратный)", g:"chins",   reps:true,  prio:1},
  {id:"wrist",  name:"Сгибания запястий на скамье",  g:"forearms",reps:false, prio:1},
  {id:"hammer", name:"Молотки",                      g:"forearms",reps:false, prio:0},
  {id:"lat",    name:"Широкая вертикальная тяга",    g:"backrow", reps:false, prio:0},
  {id:"kelso",  name:"Kelso shrugs",                 g:"backrow", reps:false, prio:0},
  {id:"hyper",  name:"Гиперэкстензия",               g:"lowback", reps:false, prio:0},
  {id:"delts",  name:"Махи на среднюю дельту",       g:"delts",   reps:false, prio:0},
  {id:"press1", name:"Жим-присед одноногий",         g:"quads",   reps:false, prio:0},
  {id:"ext",    name:"Разгибания",                   g:"quads",   reps:false, prio:0},
  {id:"glute",  name:"Ягодицы (упражнение уточним)", g:"glutes",  reps:false, prio:0},
  {id:"calf",   name:"Икры",                         g:"calves",  reps:false, prio:0},
  {id:"abs",    name:"Пресс",                        g:"abs",     reps:false, prio:0},
  {id:"french", name:"Французский жим с гантелями",  g:"triceps", reps:false, prio:0},
];

function freshState(){
  const tg = {};
  for(const k in GROUPS) tg[k] = {min:GROUPS[k].min, max:GROUPS[k].max};
  return {
    v:1,
    ex: JSON.parse(JSON.stringify(DEFAULT_EX)),
    tg,
    log: [
      {id:"seed1", d:"2026-08-06", ex:"bench", sets:[{w:55,r:9},{w:60,r:5},{w:60,r:5},{w:60,r:5},{w:60,r:5}], note:"стартовая запись из разговора"},
      {id:"seed2", d:"2026-08-06", ex:"chin",  sets:[{w:0,r:3},{w:0,r:3},{w:0,r:3},{w:0,r:3}], note:"подходы по памяти — поправь, если было иначе"}
    ],
    body: {}   // "YYYY-MM-DD": {w, waist, alco, ready}
  };
}

let S;
try { S = JSON.parse(localStorage.getItem(LS_KEY)) || freshState(); }
catch(e){ S = freshState(); }
if(!S.ex || !S.log) S = freshState();

/* миграция v2: пятница 07.08 из разговора, веса тела, ревизия упражнений */
if(S.v===1){
  S.v=2;
  if(S.tg.glutes) S.tg.glutes.min=0;
  const p=S.ex.find(e=>e.id==="press1"); if(p) p.name="Жим одноногий (ноги + ягодицы)";
  const g=S.ex.find(e=>e.id==="glute"); if(g) g.arch=true;
  const x=S.ex.find(e=>e.id==="ext"); if(x) x.arch=true;
  if(!S.ex.some(e=>e.id==="ohp")) S.ex.push({id:"ohp", name:"Жим гантелей вверх", g:"delts", reps:false, prio:0});
  if(!S.log.some(e=>e.id==="seed3")){
    S.log.push(
      {id:"seed3",  d:"2026-08-07", ex:"lat",    sets:[{w:36,r:20},{w:43,r:7},{w:36,r:15}]},
      {id:"seed4",  d:"2026-08-07", ex:"delts",  sets:[{w:5,r:18},{w:5,r:18},{w:5,r:18}]},
      {id:"seed5",  d:"2026-08-07", ex:"ohp",    sets:[{w:17.5,r:7},{w:15,r:8},{w:15,r:9}]},
      {id:"seed6",  d:"2026-08-07", ex:"wrist",  sets:[{w:20,r:7},{w:20,r:7},{w:20,r:7},{w:20,r:10}]},
      {id:"seed7",  d:"2026-08-07", ex:"french", sets:[{w:0,r:0},{w:0,r:0},{w:0,r:0}], note:"цифры не записаны"},
      {id:"seed8",  d:"2026-08-07", ex:"kelso",  sets:[{w:0,r:0},{w:0,r:0}], note:"цифры не записаны"},
      {id:"seed9",  d:"2026-08-07", ex:"abs",    sets:[{w:0,r:0},{w:0,r:0}]},
      {id:"seed10", d:"2026-08-07", ex:"hyper",  sets:[{w:0,r:0}], note:"с дропсетом"},
      {id:"seed11", d:"2026-08-07", ex:"press1", sets:[{w:0,r:0},{w:0,r:0},{w:0,r:0}]},
      {id:"seed12", d:"2026-08-07", ex:"calf",   sets:[{w:0,r:0},{w:0,r:0},{w:0,r:0}]}
    );
  }
  S.body["2026-08-06"]=Object.assign({}, S.body["2026-08-06"], {alco:true});
  if(S.body["2026-08-06"].w==null) S.body["2026-08-06"].w=81.55;
  S.body["2026-08-08"]=S.body["2026-08-08"]||{};
  if(S.body["2026-08-08"].w==null) S.body["2026-08-08"].w=82.6;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
}

function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){ toast("Не удалось сохранить (память браузера)"); } }

/* ---------- date helpers ---------- */
function dstr(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0"); return y+"-"+m+"-"+dd; }
function today(){ return dstr(new Date()); }
function addDays(s,n){ const [y,m,d]=s.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dstr(dt); }
function daysBetween(a,b){ const [y1,m1,d1]=a.split("-").map(Number),[y2,m2,d2]=b.split("-").map(Number); return Math.round((new Date(y2,m2-1,d2)-new Date(y1,m1-1,d1))/86400000); }
function fmtDay(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"short"}); }
function weekDates(){ const t=today(); const arr=[]; for(let i=6;i>=0;i--) arr.push(addDays(t,-i)); return arr; }
function shiftYM(ym,delta){ const [y,m]=ym.split("-").map(Number); const d=new Date(y,m-1+delta,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function num(v){ return parseFloat(String(v).replace(",",".").replace(/\s/g,"")); }

/* ---------- derived ---------- */
function exById(id){ return S.ex.find(e=>e.id===id); }
function groupCount(gid){
  const win = new Set(weekDates()); let n=0;
  for(const en of S.log){
    if(!win.has(en.d)) continue;
    const ex = exById(en.ex); if(!ex || ex.g!==gid) continue;
    if(GROUPS[gid].unit==="reps") n += en.sets.reduce((a,s)=>a+(+s.r||0),0);
    else n += en.sets.length;
  }
  return n;
}
function groupLastDate(gid){
  let last=null;
  for(const en of S.log){ const ex=exById(en.ex); if(ex && ex.g===gid){ if(!last||en.d>last) last=en.d; } }
  return last;
}
function lastEntry(exId){
  let best=null;
  for(const en of S.log){ if(en.ex===exId){ if(!best||en.d>best.d||(en.d===best.d&&en.id>best.id)) best=en; } }
  return best;
}
function est1(w,r){ return Math.round(w*(1+r/30)); }
function bestOf(exId){
  const ex=exById(exId); let b=null;
  for(const en of S.log){ if(en.ex!==exId) continue;
    for(const s of en.sets){
      if(ex.reps){ if(!b||(+s.r)>(b.r)) b={r:+s.r,w:+s.w||0,d:en.d}; }
      else { const e=est1(+s.w,+s.r); if(!b||e>b.e) b={e,w:+s.w,r:+s.r,d:en.d}; }
    }
  }
  return b;
}
function plural(n,f){ const a=Math.abs(n)%100, b=a%10; return n+" "+(a>10&&a<20?f[2]:b>1&&b<5?f[1]:b===1?f[0]:f[2]); }
function fmtSets(en){
  const ex=exById(en.ex);
  if(ex && ex.reps){
    const tot=en.sets.reduce((a,s)=>a+(+s.r||0),0);
    const parts=en.sets.map(s=> (+s.w>0? "+"+s.w+"кг×":"")+s.r );
    return parts.join("·")+" (всего "+tot+" повт)";
  }
  if(en.sets.every(s=>!(+s.w)&&!(+s.r))) return plural(en.sets.length,["подход","подхода","подходов"])+" без цифр";
  const out=[]; let i=0;
  while(i<en.sets.length){
    let j=i; while(j+1<en.sets.length && en.sets[j+1].w===en.sets[i].w && en.sets[j+1].r===en.sets[i].r) j++;
    const cnt=j-i+1; const s=en.sets[i];
    const lbl=(+s.w||+s.r)? s.w+"×"+s.r : "—";
    out.push(lbl+(cnt>1?" ×"+cnt:"")); i=j+1;
  }
  return out.join(" · ");
}
function statusOf(gid){
  const c=groupCount(gid), t=S.tg[gid]||GROUPS[gid];
  if(c<t.min) return {s:"under", c, t};
  if(c>t.max) return {s:"over", c, t};
  return {s:"ok", c, t};
}

function spark(series){
  if(series.length<2) return '<div class="empty">Мало данных — нужно хотя бы две записи</div>';
  const w=300,hh=60,p=8;
  const vs=series.map(s=>s.v);
  let mn=Math.min(...vs), mx=Math.max(...vs);
  if(mx-mn<0.5){ mx+=0.5; mn-=0.5; }
  const x=i=> p + i*(w-2*p)/(series.length-1);
  const y=v=> hh-p - (v-mn)*(hh-2*p)/(mx-mn);
  let d="M"+x(0)+" "+y(series[0].v);
  series.forEach((s,i)=>{ if(i) d+=" L"+x(i)+" "+y(s.v); });
  const last=series[series.length-1];
  return '<svg class="spark" viewBox="0 0 '+w+" "+hh+'" preserveAspectRatio="none" role="img" aria-label="график">'+
    '<path d="'+d+'"/><circle cx="'+x(series.length-1)+'" cy="'+y(last.v)+'" r="3"/>'+
    '<text x="'+p+'" y="10">'+mx.toFixed(1)+'</text><text x="'+p+'" y="'+(hh-2)+'">'+mn.toFixed(1)+"</text></svg>";
}
function weightTrend(){
  // линейная регрессия по взвешиваниям за последние 28 дней → кг/нед
  const pts=Object.entries(S.body).filter(([,v])=>v.w!=null)
    .map(([d,v])=>({x:daysBetween("2026-01-01",d), y:+v.w}))
    .sort((a,b)=>a.x-b.x);
  if(pts.length<4) return null;
  const lastX=pts[pts.length-1].x;
  const win=pts.filter(p=>p.x>=lastX-27);
  const span=win.length? win[win.length-1].x-win[0].x : 0;
  if(win.length<4||span<7) return null;
  const n=win.length;
  let sx=0,sy=0,sxx=0,sxy=0;
  win.forEach(p=>{ sx+=p.x; sy+=p.y; sxx+=p.x*p.x; sxy+=p.x*p.y; });
  const den=n*sxx-sx*sx; if(!den) return null;
  return {wk:(n*sxy-sx*sy)/den*7, n, days:span};
}

    '<div><label class="f">Вес утром, кг</label><input type="text" inputmode="decimal" id="bw" placeholder="81,4" value="'+(b.w??"")+'"></div>'+
    '<div><label class="f">Талия (пупок), см</label><input type="text" inputmode="decimal" id="waist" placeholder="85" value="'+(b.waist??"")+'"></div></div>';
  h+='<label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px"><input type="checkbox" id="alco" style="width:auto" '+(b.alco?"checked":"")+"> Сегодня алкоголь (завтра — белок и лёгкий день)</label>";
  h+='<button class="btn primary wide" id="savebody" style="margin-top:12px">Сохранить</button></div>';

  // stats
  const entries=Object.entries(S.body).filter(([d,v])=>v.w!=null).sort((a,b)=>a[0]<b[0]?-1:1);
  const win=new Set(weekDates());
  const cur=entries.filter(([d])=>win.has(d)).map(([,v])=>+v.w);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const ca=avg(cur);
  h+="<h2>Вес</h2><div class='card'>";
  if(ca!=null){
    h+='<div class="bignum num">'+ca.toFixed(1)+' <span class="small muted" style="font-weight:600">кг сейчас · среднее за 7 дней</span></div>';
    const tr=weightTrend();
    if(tr){
      const wk=tr.wk;
      let st2;
      if(wk<-0.05) st2="вес падает — это не набор";
      else if(wk<0.05) st2="стоишь на месте";
      else if(wk<0.15) st2="медленнее коридора набора — ешь смелее";
      else if(wk<=0.35) st2="в коридоре набора, так держать";
      else st2="быстрее коридора — притормози жирные вылазки";
      h+='<div class="small" style="margin-top:6px">Тренд: <b class="num">'+(wk>=0?"+":"")+wk.toFixed(2)+' кг/нед</b> <span class="muted num">≈ '+(wk>=0?"+":"")+(wk*4.35).toFixed(1)+" кг/мес</span></div>";
      h+='<div class="small muted">'+st2+" · коридор +0,15…+0,35 кг/нед · по "+tr.n+" взвешиваниям за "+plural(tr.days,["день","дня","дней"])+"</div>";
    } else {
      h+='<div class="small muted" style="margin-top:6px">Тренд (кг/нед) появится после 4+ взвешиваний с разбегом от недели. Взвешивайся каждое утро — «нечестные» дни тоже, среднее их сгладит.</div>';
    }
  } else h+='<div class="empty">Взвешивайся каждое утро: после туалета, до еды. Считается только среднее за 7 дней — дневные скачки шум.</div>';
  h+=spark(entries.slice(-60).map(([d,v])=>({d,v:+v.w})));
  h+="</div>";

  const wents=Object.entries(S.body).filter(([d,v])=>v.waist!=null).sort((a,b)=>a[0]<b[0]?-1:1);
  h+="<h2>Талия</h2><div class='card'>";
  if(wents.length){
    const lastW=wents[wents.length-1];
    h+='<div class="bignum num">'+(+lastW[1].waist).toFixed(1)+' <span class="small muted" style="font-weight:600">см · '+fmtDay(lastW[0])+"</span></div>";
    if(wents.length>1){ const d=+lastW[1].waist - +wents[0][1].waist; h+='<div class="small muted">'+(d>=0?"+":"")+d.toFixed(1)+" см с первой записи</div>"; }
    h+=spark(wents.map(([d,v])=>({d,v:+v.waist})));
  } else h+='<div class="empty">Раз в неделю, утром, в тех же условиях. Не втягивать.</div>';
  h+="</div>";

  h+="<h2>Термостат набора</h2><div class='card small'>"+
    "<ul style='margin:0;padding-left:18px'>"+
    "<li>Вес +0,15–0,35 кг/нед и талия ≤ +1 см/мес → всё правильно, не трогаем.</li>"+
    "<li>Вес стоит 2 недели → +1 приём еды или шейк в день.</li>"+
    "<li>Талия бежит быстрее веса → режем жирные вылазки, не домашнюю еду.</li>"+
    "<li>Каждый приём — с белком. Овсянка без творога или яиц — не белок.</li>"+
    "<li>После алкоголя: обычная еда с белком. Голодовка запрещена.</li></ul></div>";
  view.innerHTML=h;

  document.getElementById("savebody").addEventListener("click",()=>{
    const d=today(); S.body[d]=S.body[d]||{};
    const w=num(document.getElementById("bw").value);
    const wa=num(document.getElementById("waist").value);
    S.body[d].w=isNaN(w)?undefined:w;
    S.body[d].waist=isNaN(wa)?undefined:wa;
    S.body[d].alco=document.getElementById("alco").checked||undefined;
    save(); render(); toast("Сохранено");
  });
}

/* ---------- JOURNAL ---------- */
function renderCalendar(){
  const now=today();
  const ym = calYM || now.slice(0,7);
  const [y,m]=ym.split("-").map(Number);
  const first=new Date(y,m-1,1);
  const startDow=(first.getDay()+6)%7; // понедельник = 0
  const dim=new Date(y,m,0).getDate();
  const trained=new Set(S.log.map(e=>e.d));
  const alco=new Set(Object.entries(S.body).filter(([,v])=>v.alco).map(([d])=>d));
  let h='<div class="card">';
  h+='<div class="calhead"><button class="iconbtn sm" data-cal="-1" aria-label="Прошлый месяц">‹</button><b>'+first.toLocaleDateString("ru-RU",{month:"long",year:"numeric"})+'</b><button class="iconbtn sm" data-cal="1" aria-label="Следующий месяц">›</button></div>';
  h+='<div class="cal">';
  ["пн","вт","ср","чт","пт","сб","вс"].forEach(w=>h+='<div class="wd">'+w+"</div>");
  for(let i=0;i<startDow;i++) h+="<div></div>";
  for(let d=1;d<=dim;d++){
    const ds=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const cls=["day"]; if(trained.has(ds))cls.push("tr"); if(ds===now)cls.push("today"); if(logDate===ds)cls.push("sel");
    h+='<button class="'+cls.join(" ")+'" data-day="'+ds+'">'+d+(alco.has(ds)?"<i></i>":"")+"</button>";
  }
  h+="</div>";
  h+='<div class="xs muted" style="margin-top:8px">Зелёное — был в зале, точка — алкоголь. Тапни день, чтобы увидеть записи.</div>';
  h+="</div>";
  return h;
}
function renderLog(){
  let h='<h2 style="margin-top:16px">Журнал</h2>';
  h+=renderCalendar();
  h+='<select id="logfilter" style="margin-bottom:10px"><option value="all">Все упражнения</option>';
  [...S.ex].sort((a,b)=>GROUPS[a.g].ord-GROUPS[b.g].ord).forEach(e=>{ h+='<option value="'+e.id+'" '+(logFilter===e.id?"selected":"")+">"+esc(e.name)+"</option>"; });
  h+="</select>";

  if(logDate) h+='<div class="linkline" style="margin:0 2px 10px">Записи за '+fmtDay(logDate)+' — <button class="linkbtn" id="cleardate">показать все</button></div>';

  const list=S.log
    .filter(e=>logFilter==="all"||e.ex===logFilter)
    .filter(e=>!logDate||e.d===logDate)
    .sort((a,b)=> a.d<b.d?1:a.d>b.d?-1:0);
  if(logFilter!=="all"){
    const be=bestOf(logFilter); const ex=exById(logFilter);
    if(be) h+='<div class="banner info">Лучшее: <span class="num">'+(ex.reps? be.r+" повт"+(be.w?" (+"+be.w+" кг)":"") : be.w+"×"+be.r+" ≈ "+be.e+" на раз")+"</span> · "+fmtDay(be.d)+"</div>";
  }
  if(!list.length) h+='<div class="empty">'+(logDate?"В этот день записей нет":"Пока пусто")+"</div>";
  let curD=null;
  list.forEach(en=>{
    if(en.d!==curD){ if(curD!==null) h+="</div>"; curD=en.d; h+='<div class="daterow">'+fmtDay(en.d)+'</div><div class="card tight">'; }
    const ex=exById(en.ex);
    h+='<div class="entry"><div><div class="ex">'+esc(ex?ex.name:"?")+'</div><div class="sets num">'+fmtSets(en)+"</div>"+(en.note?'<div class="note">'+esc(en.note)+"</div>":"")+"</div>"+
       '<button data-del="'+en.id+'" aria-label="Удалить">✕</button></div>';
  });
  if(curD!==null) h+="</div>";
  view.innerHTML=h;

  document.querySelectorAll("[data-cal]").forEach(bt=>{
    bt.addEventListener("click",()=>{ calYM=shiftYM(calYM||today().slice(0,7), +bt.dataset.cal); render(); });
  });
  document.querySelectorAll("[data-day]").forEach(bt=>{
    bt.addEventListener("click",()=>{ logDate=(logDate===bt.dataset.day?null:bt.dataset.day); render(); });
  });
  const cd=document.getElementById("cleardate");
  if(cd) cd.addEventListener("click",()=>{ logDate=null; render(); });
  document.getElementById("logfilter").addEventListener("change",e=>{ logFilter=e.target.value; render(); });
  wireEntryDeletes();
}

/* ---------- SETTINGS ---------- */
const settingsEl=document.getElementById("settings");
function openSettings(focus){
  const w=settingsEl.querySelector(".wrap");
  let h='<div class="ovhead"><b>Настройки</b><button class="iconbtn" id="closeset">✕</button></div>';

  h+="<h2>Недельные диапазоны</h2><div class='card'>";
  h+='<div class="xs muted" style="margin-bottom:6px">Коридор объёма на 7 дней: мин — ниже роста не жди, макс — потолок восстановления.</div>';
  h+='<div class="tgrow head"><span></span><span class="xs muted">мин</span><span class="xs muted">макс</span></div>';
  Object.keys(GROUPS).sort((a,b)=>GROUPS[a].ord-GROUPS[b].ord).forEach(g=>{
    const t=S.tg[g];
    h+='<div class="tgrow"><span class="n">'+esc(GROUPS[g].name)+' <span class="xs muted">('+(GROUPS[g].unit==="reps"?"повт":"подх")+')</span></span>'+
       '<input type="number" inputmode="numeric" aria-label="минимум" data-g="'+g+'" data-k="min" value="'+t.min+'">'+
       '<input type="number" inputmode="numeric" aria-label="максимум" data-g="'+g+'" data-k="max" value="'+t.max+'"></div>';
  });
  h+='<button class="btn wide" id="savetg" style="margin-top:8px">Сохранить</button></div>';

  h+="<h2 id='addexh'>Добавить упражнение</h2><div class='card'>";
  h+='<label class="f">Название</label><input type="text" id="newname" placeholder="Например: Ягодичный мост">';
  h+='<label class="f" style="margin-top:8px">Группа</label><select id="newgroup">';
  Object.keys(GROUPS).sort((a,b)=>GROUPS[a].ord-GROUPS[b].ord).forEach(g=>{ h+='<option value="'+g+'">'+esc(GROUPS[g].name)+"</option>"; });
  h+="</select>";
  h+='<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px"><input type="checkbox" id="newreps" style="width:auto"> Считать повторения, а не подходы (как подтягивания)</label>';
  h+='<button class="btn primary wide" id="addexbtn" style="margin-top:10px">Добавить</button></div>';

  h+="<h2>Упражнения</h2><div class='card tight'>";
  S.ex.forEach(e=>{
    h+='<div class="entry"><div><span class="ex">'+esc(e.name)+'</span> <span class="xs muted">'+esc(GROUPS[e.g].name)+"</span></div>"+
       '<button class="btn sm" data-arch="'+e.id+'">'+(e.arch?"вернуть":"скрыть")+"</button></div>";
  });
  h+="</div>";

  h+="<h2>Данные</h2><div class='card'>";
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="exportbtn">Экспорт в файл</button><button class="btn" id="importbtn">Импорт</button><button class="btn danger" id="wipebtn">Стереть всё</button></div>';
  h+='<div id="iozone" style="margin-top:10px"></div>';
  h+='<p class="xs muted" style="margin-bottom:0">Данные живут в браузере этого устройства. Раз в неделю делай экспорт — страховка.</p></div>';

  w.innerHTML=h;
  settingsEl.classList.add("open");
  document.getElementById("closeset").addEventListener("click",()=>settingsEl.classList.remove("open"));

  document.getElementById("savetg").addEventListener("click",()=>{
    w.querySelectorAll(".tgrow input").forEach(inp=>{
      const v=parseInt(inp.value,10); if(!isNaN(v)&&v>=0) S.tg[inp.dataset.g][inp.dataset.k]=v;
    });
    for(const g in S.tg){ if(S.tg[g].max<S.tg[g].min) S.tg[g].max=S.tg[g].min; }
    save(); toast("Диапазоны сохранены"); render();
  });
  document.getElementById("addexbtn").addEventListener("click",()=>{
    const name=document.getElementById("newname").value.trim();
    if(!name){ toast("Введи название"); return; }
    S.ex.push({id:uid(), name, g:document.getElementById("newgroup").value, reps:document.getElementById("newreps").checked, prio:0});
    save(); toast("Добавлено: "+name); settingsEl.classList.remove("open"); render();
  });
  w.querySelectorAll("[data-arch]").forEach(bt=>{
    bt.addEventListener("click",()=>{ const e=exById(bt.dataset.arch); e.arch=!e.arch; save(); openSettings(); });
  });
  document.getElementById("exportbtn").addEventListener("click",doExport);
  document.getElementById("importbtn").addEventListener("click",()=>{
    document.getElementById("iozone").innerHTML=
      '<label class="f">Вставь JSON экспорта</label><textarea class="io" id="importtext"></textarea>'+
      '<input type="file" id="importfile" accept=".json" style="margin-top:8px">'+
      '<button class="btn primary wide" id="doimport" style="margin-top:8px">Импортировать (заменит текущее)</button>';
    document.getElementById("importfile").addEventListener("change",ev=>{
      const f=ev.target.files[0]; if(!f) return;
      const r=new FileReader(); r.onload=()=>{ document.getElementById("importtext").value=r.result; }; r.readAsText(f);
    });
    document.getElementById("doimport").addEventListener("click",()=>{
      const bt=document.getElementById("doimport");
      try{
        const data=JSON.parse(document.getElementById("importtext").value);
        const st=data.state||data;
        if(!st.log||!st.ex) throw new Error("bad");
        if(!bt.dataset.armed){
          bt.dataset.armed="1"; bt.textContent="Заменит все данные — точно?";
          setTimeout(()=>{ if(document.body.contains(bt)){ delete bt.dataset.armed; bt.textContent="Импортировать (заменит текущее)"; } },4000);
          return;
        }
        S=st; save(); settingsEl.classList.remove("open"); render(); toast("Импортировано");
      }catch(e){ toast("Не похоже на файл экспорта"); }
    });
  });
  document.getElementById("wipebtn").addEventListener("click",()=>{
    const bt=document.getElementById("wipebtn");
    if(bt.dataset.armed){ S=freshState(); save(); settingsEl.classList.remove("open"); render(); toast("Чистый лист"); return; }
    bt.dataset.armed="1"; bt.textContent="Точно стереть? Навсегда";
    setTimeout(()=>{ if(document.body.contains(bt)){ delete bt.dataset.armed; bt.textContent="Стереть всё"; } },4000);
  });
  if(focus==="addex"){ const el=document.getElementById("addexh"); if(el) el.scrollIntoView(); }
}
async function doExport(){
  const payload=JSON.stringify({app:"ilya-gym", version:1, exportedAt:new Date().toISOString(), state:S}, null, 1);
  const fname="gym-log-"+today()+".json";
  if(window.claude && window.claude.downloads && window.claude.downloads.save){
    try{ await window.claude.downloads.save({filename:fname, data:payload}); toast("Файл сохранён"); return; }
    catch(e){ /* пользователь мог отменить — падаем в запасной вариант */ }
  }
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([payload],{type:"application/json"}));
    a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    toast("Файл скачан");
  }catch(e){
    document.getElementById("iozone").innerHTML='<label class="f">Скопируй и сохрани куда-нибудь</label><textarea class="io">'+esc(payload)+"</textarea>";
  }
}
document.getElementById("gear").addEventListener("click",()=>openSettings());

/* ---------- render root ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===TAB));
  if(TAB==="today") renderToday();
  else if(TAB==="week") renderWeek();
  else if(TAB==="body") renderBody();
  else renderLog();
}
render();

/* ---------- offline ---------- */
if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
